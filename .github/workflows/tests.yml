name: Node tests
on:
  push:
    branches: [feat/srw-combat-skills-rebalance]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
      - run: node --check server.js
      - run: node --check public/client.js
      - run: node --check public/rules.js
